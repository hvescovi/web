[project]
name = "festa-ifc"
version = "0.1.0"
description = "Sistema para organizar a festa do IFC Campus Blumenau"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymysql>=1.1.1",
    "sqlalchemy>=2.0.36",
    "streamlit>=1.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
]

[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/party_organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
